<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Development Glossary</title>
  <link rel="stylesheet" href="assignment.css">
</head>
<body>

<main class="container">
  <h1>Web Development Glossary</h1>
  <p class="subtitle">
    Search common web development terms and definitions.
  </p>

  <label for="searchInput">Search glossary terms</label>
  <input
    type="text"
    id="searchInput"
    placeholder="Search for a term..."
  >

  <div id="resultCount" aria-live="polite">
    Showing 15 of 15 terms
  </div>

  <div id="glossaryList"></div>

  <div id="noMatches">
    No matches found. Try another search.
  </div>
</main>

<script src="assignment.js"></script>
</body>
</html>
